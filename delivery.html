<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Bazaar Delivery</title>
<style>
:root{--g:#087f3e;--bg:#f4f8f4;--line:#dfe8e1;--muted:#627066}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,Arial;color:#17231b}header{background:linear-gradient(120deg,#05612e,#0aa65a);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}main{max-width:800px;margin:20px auto;padding:0 14px}.card,.order{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}input,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:9px}input{display:block;width:100%;margin:6px 0 12px}button{cursor:pointer;font-weight:700}.primary{background:var(--g);color:white}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.msg{margin:10px 0}.error{color:#b71c1c}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{color:var(--g);font-weight:700}
</style></head><body><header><div><b>🛵 Quick Bazaar</b><div>Delivery Partner Panel</div></div><button id="logout" class="hidden">Log out</button></header><main>
<section id="login" class="card"><h2>Delivery partner login</h2><p class="muted">Use your approved delivery account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary">Sign in</button></form><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hidden"><div class="row"><h2>My assigned orders</h2><button id="refresh">Refresh</button></div><p class="muted">Only orders assigned to your account should appear.</p><div id="appMsg" class="msg"></div><div id="orders"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const db=window.supabase.createClient('https://iyymngisowylexljykpo.supabase.co','sb_publishable_M2Yvf-qj8aPmTrMQ1KXsdg_2KI8RYNy'),$=id=>document.getElementById(id);
function msg(id,t,err=false){$(id).textContent=t;$(id).className='msg'+(err?' error':'')}function app(on){$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on)}
async function verify(){const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Please sign in.');const {data,error}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;if(!data||data.role!=='delivery_boy')throw Error('Account role is not delivery_boy. Admin must approve this account in profiles.');return user}
async function load(){try{msg('appMsg','Loading…');const u=await verify();const {data,error}=await db.from('orders').select('id,status,payment_method,payment_status,subtotal,delivery_fee,total,created_at').eq('delivery_boy_id',u.id).order('created_at',{ascending:false});if(error)throw error;if(!data.length){$('orders').innerHTML='<div class="card">No assigned orders yet.</div>';msg('appMsg','');return}
$('orders').innerHTML=data.map(o=>'<article class="order"><div class="row"><b>Order #'+o.id+'</b><span class="status">'+String(o.status||'Pending')+'</span></div><p>Payment: '+String(o.payment_method||'COD')+' · '+String(o.payment_status||'Pending')+'</p><p>Total: ₹'+Number(o.total||0).toFixed(2)+'</p><p class="muted">'+new Date(o.created_at).toLocaleString()+'</p><div class="actions"><button data-id="'+o.id+'" data-s="Preparing">Picked up</button><button data-id="'+o.id+'" data-s="Out for delivery">Out for delivery</button><button class="primary" data-id="'+o.id+'" data-s="Delivered">Delivered</button></div></article>').join('');
$('orders').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.s));msg('appMsg',data.length+' assigned order(s).')
}catch(e){msg('appMsg','Could not load orders: '+e.message,true)}}
async function update(id,status){const {data:{user}}=await db.auth.getUser();const {error}=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id).eq('delivery_boy_id',user.id);if(error){msg('appMsg','Update failed: '+error.message,true);return}load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg',error.message,true);return}try{await verify();app(true);load()}catch(x){await db.auth.signOut();msg('loginMsg',x.message,true)}};
$('logout').onclick=async()=>{await db.auth.signOut();app(false)};$('refresh').onclick=load;
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){try{await verify();app(true);load()}catch(e){msg('loginMsg',e.message,true)}}})();
})();</script></body></html>
