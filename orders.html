<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Bazaar — COD Orders</title>
<style>
:root{--g:#087f3e;--bg:#f4f8f4;--line:#dfe8e1;--muted:#627066}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,Arial;color:#17231b}header{background:linear-gradient(120deg,#05612e,#0aa65a);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:20px auto;padding:0 14px}.card,.order{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.hidden{display:none!important}input,select,button{font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px}input,select{display:block;width:100%;margin:6px 0 12px}button{cursor:pointer;font-weight:700}.primary{background:var(--g);color:white}.muted{color:var(--muted);font-size:13px}.msg{margin:10px 0}.error{color:#b71c1c}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);padding:14px;border-radius:12px}.stat b{display:block;font-size:23px}.order h3{margin:0}.items{white-space:pre-wrap;background:#f7faf7;border-radius:8px;padding:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><b>🛒 Quick Bazaar</b><div>Admin · COD Orders</div></div><button id="logout" class="hidden">Log out</button></header>
<main>
<section id="login" class="card"><h2>Admin sign in</h2><p class="muted">Use the same admin account as the existing admin panel.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="primary">Sign in</button></form><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hidden"><div class="row"><h2>Customer COD Orders</h2><button id="refresh">Refresh orders</button></div><div class="grid"><div class="stat">All orders<b id="all">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Delivered<b id="delivered">0</b></div></div><div id="appMsg" class="msg"></div><div id="orders"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const db=window.supabase.createClient('https://iyymngisowylexljykpo.supabase.co','sb_publishable_M2Yvf-qj8aPmTrMQ1KXsdg_2KI8RYNy'),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,s,err=false){$(id).textContent=s;$(id).className='msg'+(err?' error':'')}
function show(on){$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on)}
async function verify(){const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Please sign in.');const {data,error}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error)throw error;if(!data||data.role!=='admin')throw Error('This account is not marked admin in profiles.');}
async function load(){msg('appMsg','Loading orders…');try{await verify();const {data,error}=await db.from('customer_orders').select('*').order('created_at',{ascending:false});if(error)throw error;const a=data||[];$('all').textContent=a.length;$('pending').textContent=a.filter(x=>x.status==='Pending').length;$('delivered').textContent=a.filter(x=>x.status==='Delivered').length;
$('orders').innerHTML=a.length?a.map(o=>`<article class="order"><div class="row"><h3>Order #${esc(o.order_number||o.id)}</h3><b>${esc(o.status)}</b></div><p><b>${esc(o.customer_name)}</b> · <a href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a></p><p>Address: ${esc(o.delivery_address)}</p><div class="items">${esc((o.items||[]).map(x=>`${x.name||x.product_name||'Product'} × ${x.quantity||x.qty||1} — ₹${Number(x.price||0).toFixed(2)}`).join('\\n'))}</div><p>Subtotal: ₹${Number(o.subtotal||0).toFixed(2)} · Delivery: ₹${Number(o.delivery_fee||0).toFixed(2)}</p><p><b>Total COD: ₹${Number(o.total||0).toFixed(2)}</b></p><p class="muted">Placed: ${new Date(o.created_at).toLocaleString()}</p><div class="actions"><select data-status="${esc(o.id)}">${['Pending','Confirmed','Preparing','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button class="primary" data-save="${esc(o.id)}">Save status</button></div></article>`).join(''):'<div class="card">No orders yet.</div>';
$('orders').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,status=$('orders').querySelector(`[data-status="${CSS.escape(id)}"]`).value;const {error}=await db.from('customer_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){msg('appMsg','Update failed: '+error.message,true);return}await load()});msg('appMsg',a.length+' order(s) loaded.');
}catch(e){msg('appMsg','Could not load orders: '+e.message,true)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','Signing in…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg',error.message,true);return}try{await verify();show(true);await load()}catch(x){msg('loginMsg',x.message,true);await db.auth.signOut()}};
$('logout').onclick=async()=>{await db.auth.signOut();show(false)};$('refresh').onclick=load;
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){try{await verify();show(true);await load()}catch(e){await db.auth.signOut()}}})();
})();
</script></body></html>
