<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07883f"><title>Quick Bazaar</title>
<style>
:root{--g:#07883f;--bg:#f5f8f5;--ink:#17221b;--muted:#68736d;--line:#e3ebe4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,Arial;padding-bottom:75px}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1000px;margin:auto}header{position:sticky;top:0;z-index:30;background:var(--g);color:white;padding:12px;box-shadow:0 3px 12px #0002}.top{display:flex;align-items:center;gap:10px}.brand{font-size:22px;font-weight:900;white-space:nowrap}.brand span{color:#dfff73}.loc{flex:1;min-width:0;text-align:left;background:none;color:white;padding:5px}.loc small{display:block;font-size:10px}.loc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.profile{background:#ffffff25;color:white;border-radius:10px;width:40px;height:40px;font-size:20px}.search{display:flex;gap:8px;background:white;color:#68736d;border-radius:12px;margin-top:10px;padding:11px}.search input{width:100%;border:0;outline:0}.cats{position:sticky;top:111px;z-index:20;display:flex;gap:8px;overflow-x:auto;background:white;padding:10px;scrollbar-width:none;border-bottom:1px solid var(--line)}.cats::-webkit-scrollbar{display:none}.cat{flex:0 0 76px;background:white;border:1px solid transparent;border-radius:12px;padding:6px 3px;font-size:11px;font-weight:750;color:#47534a}.cat .em{display:grid;place-items:center;height:42px;background:#eaf7ed;border-radius:10px;font-size:23px;margin-bottom:5px}.cat.active{border-color:#70c48a;color:var(--g);background:#f0fff3}.hero{margin:12px;border-radius:17px;background:linear-gradient(125deg,#e0ffd2,#b9ed9b);padding:22px;display:flex;justify-content:space-between;align-items:center;gap:8px}.hero h1{font-size:clamp(24px,5vw,36px);line-height:1.05;margin:0 0 8px}.hero h1 span{color:var(--g)}.hero p{font-weight:650}.hero .art{font-size:65px}.shop,.primary{background:var(--g);color:white;border-radius:11px;padding:11px 15px;font-weight:850}.main{padding:0 10px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{font-size:18px}.muted{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{position:relative;background:white;border:1px solid #e7eee7;border-radius:14px;padding:9px;min-width:0}.photo{height:120px;background:#f2f7f2;border-radius:10px;display:grid;place-items:center;font-size:45px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.name{font-size:12px;font-weight:850;min-height:32px;margin-top:8px}.price{font-weight:900;font-size:16px}.old{font-size:11px;color:#999;text-decoration:line-through;margin-left:5px}.heart{position:absolute;right:13px;top:13px;background:#fff;border-radius:50%;width:31px;height:31px;font-size:17px;color:#d34}.heart.on{background:#ffe8ed}.addrow{display:flex;gap:5px;margin-top:8px}.add{flex:1;border:1px solid #a6dcb5;background:#edfaef;color:var(--g);border-radius:9px;padding:8px;font-size:12px;font-weight:900}.add:disabled{opacity:.5}.qty{display:flex;align-items:center;gap:10px;background:#edfaef;color:var(--g);border-radius:9px;padding:4px 8px;font-weight:900}.qty button{background:none;color:var(--g);font-size:18px}.empty{grid-column:1/-1;text-align:center;background:white;border-radius:13px;padding:35px 12px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.bottom{position:fixed;bottom:0;left:0;right:0;height:68px;background:white;border-top:1px solid var(--line);z-index:40;display:flex;justify-content:space-around;align-items:center}.nav{background:none;color:#68736d;font-size:10px;min-width:52px}.nav span{display:block;font-size:21px}.badge{color:#fff;background:#df3946;border-radius:12px;padding:1px 5px;font-size:9px}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:80}.overlay.show{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;max-height:90vh;overflow:auto;background:white;border-radius:22px 22px 0 0;padding:17px max(16px,calc((100vw - 680px)/2));padding-bottom:25px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{font-size:20px}.close{width:34px;height:34px;border-radius:50%;background:#eee}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #dce5dd;border-radius:10px}.primary{width:100%;margin-top:10px}.secondary{width:100%;margin-top:8px;background:#eaf7ed;color:var(--g);padding:11px;border-radius:10px;font-weight:850}.line{display:flex;justify-content:space-between;padding:8px 0;font-weight:850}.cartline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.mini{width:48px;height:48px;display:grid;place-items:center;background:#f2f7f2;border-radius:8px;overflow:hidden}.mini img{width:100%;height:100%;object-fit:contain}.ci{flex:1;font-size:12px}.stepper{display:flex;align-items:center;gap:7px}.stepper button{background:#eaf7ed;color:var(--g);border-radius:7px;padding:5px 8px}.toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#17221b;color:white;padding:10px 15px;border-radius:20px;z-index:100;max-width:90vw}.toast.show{display:block}@media(min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:145px}}@media(min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><div class="wrap">
<header><div class="top"><div class="brand">Quick <span>Bazaar</span></div><button class="loc" onclick="openAddresses()"><small>📍 DELIVER TO</small><b id="headerAddress">Choose your address ▾</b></button><button class="profile" onclick="openProfile()">👤</button></div><label class="search">🔎 <input id="search" placeholder="Search products..." oninput="renderProducts()"></label></header>
<nav class="cats" id="cats"><button class="cat active" data-cat="all" onclick="setCategory('all',this)"><span class="em">🛍️</span>All</button><button class="cat" data-cat="grocery" onclick="setCategory('grocery',this)"><span class="em">🌾</span>Grocery</button><button class="cat" data-cat="fresh" onclick="setCategory('fresh',this)"><span class="em">🍎</span>Fresh</button><button class="cat" data-cat="beauty" onclick="setCategory('beauty',this)"><span class="em">🧴</span>Beauty</button><button class="cat" data-cat="home" onclick="setCategory('home',this)"><span class="em">🏠</span>Home</button><button class="cat" data-cat="electronics" onclick="setCategory('electronics',this)"><span class="em">📱</span>Electronics</button><button class="cat" data-cat="gifting" onclick="setCategory('gifting',this)"><span class="em">🎁</span>Gifting</button><button class="cat" data-cat="clothes" onclick="setCategory('clothes',this)"><span class="em">👕</span>Clothes</button><button class="cat" data-cat="other" onclick="setCategory('other',this)"><span class="em">✨</span>Other</button></nav>
<section class="hero"><div><h1>Everyday essentials,<br><span>made easy.</span></h1><p>Shop live products from Quick Bazaar.</p><button class="shop" onclick="setCategory('all',document.querySelector('[data-cat=all]'))">Shop now →</button></div><div class="art">🛍️🥬</div></section>
<main class="main"><div class="head"><h2 id="listingTitle">Products</h2><button class="secondary" style="width:auto;margin:0" onclick="loadProducts()">↻ Refresh</button></div><p id="productMessage" class="muted"></p><div id="products" class="grid"><div class="empty">Loading products…</div></div></main>
<footer style="padding:22px;text-align:center;color:#718076;font-size:11px">Quick Bazaar · Cash on Delivery · <a href="admin.html" style="color:#07883f">Admin</a></footer></div>
<nav class="bottom"><button class="nav" onclick="home()"><span>⌂</span>Home</button><button class="nav" onclick="openCategories()"><span>▦</span>Categories</button><button class="nav" onclick="openWishlist()"><span>♡ <sup id="wishBadge"></sup></span>Wishlist</button><button class="nav" onclick="openOrders()"><span>▤</span>Orders</button><button class="nav" onclick="openCart()"><span>🛒 <sup id="cartBadge"></sup></span>Cart</button></nav>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const URL='https://iyymngisowylexljykpo.supabase.co',KEY='sb_publishable_M2Yvf-qj8aPmTrMQ1KXsdg_2KI8RYNy',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
let products=[],cart=read('qb_cart',{}),wishlist=read('qb_wishlist',[]),profile=read('qb_user',null),addresses=read('qb_addresses',[]),selectedAddress=localStorage.getItem('qb_selected_address')||'',activeCategory='all',timer;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2800)}function openSheet(h){$('sheet').innerHTML=h;$('overlay').classList.add('show')}function closeSheet(){$('overlay').classList.remove('show')}function qty(id){return Number(cart[String(id)]||0)}function updateBadges(){$('cartBadge').textContent=Object.values(cart).reduce((a,b)=>a+Number(b),0)||'';$('wishBadge').textContent=wishlist.length||''}
function image(p){return p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:({'fresh':'🍎','beauty':'🧴','home':'🏠','electronics':'📱','clothes':'👕','gifting':'🎁'}[String(p.category).toLowerCase()]||'🛒')}
function setCategory(cat,btn){activeCategory=cat;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===cat));if(btn)btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});$('listingTitle').textContent=cat==='all'?'Products':cat[0].toUpperCase()+cat.slice(1);renderProducts();window.scrollTo({top:0,behavior:'smooth'})}
function renderProducts(){const q=$('search').value.trim().toLowerCase(),list=products.filter(p=>(activeCategory==='all'||String(p.category||'other').toLowerCase()===activeCategory)&&(!q||[p.name,p.brand,p.category].some(v=>String(v||'').toLowerCase().includes(q))));$('products').innerHTML=list.length?list.map(p=>{const id=String(p.id),n=qty(id),price=Number(p.price||0),old=Number(p.old_price||p.mrp||0),off=old>price?Math.round((old-price)*100/old):0;return `<article class="product"><div class="photo">${image(p)}</div>${off?`<span style="position:absolute;top:13px;left:13px;background:#df3946;color:white;border-radius:5px;padding:3px 5px;font-size:9px">${off}% OFF</span>`:''}<button class="heart ${wishlist.includes(id)?'on':''}" onclick="toggleWish('${esc(id)}')">${wishlist.includes(id)?'♥':'♡'}</button><div class="name">${esc(p.name)}</div><div class="muted">${esc(p.pack_size||p.subcategory||p.brand||'')}</div><div style="margin-top:5px"><span class="price">${money(price)}</span>${old>price?`<span class="old">${money(old)}</span>`:''}</div><div class="addrow">${n?`<div class="qty"><button onclick="changeQty('${esc(id)}',-1)">−</button>${n}<button onclick="changeQty('${esc(id)}',1)">+</button></div>`:`<button class="add" ${Number(p.stock||0)<=0?'disabled':''} onclick="changeQty('${esc(id)}',1)">${Number(p.stock||0)<=0?'Out of stock':'＋ ADD'}</button>`}</div></article>`}).join(''):'<div class="empty"><b>'+(products.length?'No products found':'No active products yet')+'</b>'+(products.length?'Try another category/search.':'Add and activate products in Admin Panel. They will appear here automatically.')+'</div>';updateBadges()}
async function loadProducts(){$('productMessage').textContent='Loading live inventory…';try{const {data,error}=await db.from('products').select('*').eq('is_active',true).order('id',{ascending:false});if(error)throw error;products=(data||[]).filter(p=>p.name);$('productMessage').textContent=products.length?`${products.length} live products from Admin Panel.`:'No active products found. Add/activate products in Admin Panel.';renderProducts()}catch(e){console.error(e);$('productMessage').textContent='Inventory error: '+e.message;$('products').innerHTML='<div class="empty"><b>Products could not load</b>Check Supabase connection/table permissions, then Refresh.</div>'}}
function changeQty(id,d){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const n=qty(id)+d;if(n<0)return;if(d>0&&Number(p.stock||0)>0&&n>Number(p.stock))return;if(n)cart[id]=n;else delete cart[id];write('qb_cart',cart);updateBadges();renderProducts()}function toggleWish(id){wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];write('qb_wishlist',wishlist);renderProducts();if($('overlay').classList.contains('show'))openWishlist()}
function home(){closeSheet();setCategory('all',document.querySelector('[data-cat=all]'))}function openCategories(){openSheet(`<div class="sheethead"><h2>Categories</h2><button class="close" onclick="closeSheet()">×</button></div><div class="grid">${[['all','🛍️','All'],['grocery','🌾','Grocery'],['fresh','🍎','Fresh'],['beauty','🧴','Beauty'],['home','🏠','Home'],['electronics','📱','Electronics'],['gifting','🎁','Gifting'],['clothes','👕','Clothes'],['other','✨','Other']].map(c=>`<button class="secondary" onclick="closeSheet();setCategory('${c[0]}',document.querySelector('[data-cat=${c[0]}]'))">${c[1]} ${c[2]}</button>`).join('')}</div>`)}
function openWishlist(){const list=products.filter(p=>wishlist.includes(String(p.id)));openSheet(`<div class="sheethead"><h2>Wishlist</h2><button class="close" onclick="closeSheet()">×</button></div>${list.length?list.map(p=>`<div class="cartline"><div class="mini">${image(p)}</div><div class="ci"><b>${esc(p.name)}</b><br>${money(p.price)}</div><button class="secondary" style="width:auto" onclick="toggleWish('${esc(String(p.id))}')">Remove</button><button class="add" onclick="changeQty('${esc(String(p.id))}',1)">Add</button></div>`).join(''):'<div class="empty"><b>Wishlist is empty</b>Tap ♡ on a product to save it.</div>'}`)}
function openCart(){const entries=Object.entries(cart).filter(([id,q])=>q>0&&products.some(p=>String(p.id)===id)),total=entries.reduce((s,[id,q])=>s+Number(products.find(p=>String(p.id)===id).price||0)*q,0);openSheet(`<div class="sheethead"><h2>My Cart</h2><button class="close" onclick="closeSheet()">×</button></div>${entries.length?entries.map(([id,q])=>{const p=products.find(x=>String(x.id)===id);return `<div class="cartline"><div class="mini">${image(p)}</div><div class="ci"><b>${esc(p.name)}</b>${money(p.price)}</div><div class="stepper"><button onclick="changeQty('${esc(id)}',-1);openCart()">−</button>${q}<button onclick="changeQty('${esc(id)}',1);openCart()">+</button></div></div>`}).join('')+`<div class="line"><span>Total</span><span>${money(total)}</span></div><button class="primary" onclick="checkout()">Continue to COD checkout</button>`:'<div class="empty"><b>Your cart is empty</b>Add products to start shopping.</div>'}`)}
function openProfile(){openSheet(`<div class="sheethead"><h2>My Account</h2><button class="close" onclick="closeSheet()">×</button></div><form onsubmit="saveProfile(event)"><div class="field"><label>Full name</label><input id="custName" required minlength="2" value="${esc(profile?.name||'')}"></div><div class="field"><label>10-digit mobile number</label><input id="custPhone" required pattern="[0-9]{10}" maxlength="10" inputmode="numeric" value="${esc(profile?.phone||'')}"></div><button class="primary">Save profile</button></form><button class="secondary" onclick="openAddresses()">Manage delivery address</button>`)}function saveProfile(e){e.preventDefault();profile={name:$('custName').value.trim(),phone:$('custPhone').value.replace(/\D/g,'')};write('qb_user',profile);toast('Profile saved');openAddresses()}
function updateAddressLabel(){const a=addresses.find(a=>a.id===selectedAddress);$('headerAddress').textContent=a?a.text:'Choose your address ▾'}function openAddresses(){openSheet(`<div class="sheethead"><h2>Delivery address</h2><button class="close" onclick="closeSheet()">×</button></div><p class="muted">No 5 km radius restriction. GPS is optional; manual address works too.</p>${addresses.map(a=>`<div style="border:1px solid #dce5dd;border-radius:10px;padding:10px;margin:8px 0"><b>${esc(a.label||'Address')}</b><p>${esc(a.text)}</p><button class="secondary" onclick="chooseAddress('${esc(a.id)}')">${a.id===selectedAddress?'Selected':'Deliver here'}</button><button class="secondary" onclick="removeAddress('${esc(a.id)}')">Remove</button></div>`).join('')}<form onsubmit="saveAddress(event)"><div class="field"><label>Label</label><input id="addrLabel" placeholder="Home / Shop"></div><div class="field"><label>Full address and PIN code</label><textarea id="addrText" required rows="3" placeholder="House, village/town, district, Assam, PIN"></textarea></div><button class="primary">Save address</button></form><button class="secondary" onclick="useGPS()">📍 Use current GPS location</button>`)}function saveAddress(e){e.preventDefault();const a={id:String(Date.now()),label:$('addrLabel').value.trim()||'Address',text:$('addrText').value.trim()};addresses.push(a);write('qb_addresses',addresses);selectedAddress=a.id;localStorage.setItem('qb_selected_address',selectedAddress);updateAddressLabel();toast('Address saved');openAddresses()}function chooseAddress(id){selectedAddress=id;localStorage.setItem('qb_selected_address',id);updateAddressLabel();closeSheet();toast('Address selected')}function removeAddress(id){addresses=addresses.filter(a=>a.id!==id);write('qb_addresses',addresses);if(selectedAddress===id){selectedAddress='';localStorage.removeItem('qb_selected_address')}updateAddressLabel();openAddresses()}function useGPS(){if(!navigator.geolocation)return toast('GPS unavailable; enter address manually');toast('Requesting GPS permission…');navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lon=pos.coords.longitude;let text=`Current location (${lat.toFixed(5)}, ${lon.toFixed(5)})`;try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);if(r.ok){const d=await r.json();text=d.display_name||text}}catch(e){}const a={id:String(Date.now()),label:'GPS location',text,lat,lon};addresses.push(a);write('qb_addresses',addresses);selectedAddress=a.id;localStorage.setItem('qb_selected_address',a.id);updateAddressLabel();toast('GPS location saved');openAddresses()},e=>toast(e.code===1?'GPS permission denied. Enter address manually.':'GPS unavailable. Enter address manually.'),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
function checkout(){if(!profile?.name||!profile?.phone){toast('Save name and mobile number first');openProfile();return}if(!addresses.some(a=>a.id===selectedAddress)){toast('Select delivery address first');openAddresses();return}const entries=Object.entries(cart).filter(([id,q])=>q>0&&products.some(p=>String(p.id)===id));if(!entries.length)return toast('Cart is empty');const total=entries.reduce((s,[id,q])=>s+Number(products.find(p=>String(p.id)===id).price||0)*q,0);openSheet(`<div class="sheethead"><h2>Confirm COD order</h2><button class="close" onclick="closeSheet()">×</button></div><p>${esc(addresses.find(a=>a.id===selectedAddress).text)}</p><div class="line"><span>Payment</span><b>Cash on Delivery</b></div><div class="line"><span>Total</span><b>${money(total)}</b></div><button class="primary" id="placeBtn" onclick="placeOrder()">Place COD order</button>`)}async function placeOrder(){const btn=$('placeBtn');btn.disabled=true;btn.textContent='Placing order…';try{const addr=addresses.find(a=>a.id===selectedAddress);const items=Object.entries(cart).filter(([id,q])=>q>0&&products.some(p=>String(p.id)===id)).map(([id,q])=>{const p=products.find(x=>String(x.id)===id);return {product_id:String(p.id),name:p.name,price:Number(p.price||0),quantity:Number(q),total:Number(p.price||0)*q}});if(!profile?.name||!profile?.phone||!addr||!items.length)throw Error('Check profile, address and cart');const subtotal=items.reduce((s,x)=>s+x.total,0);const payload={customer_name:profile.name,customer_phone:profile.phone,delivery_address:addr.text,items,subtotal,delivery_fee:0,total:subtotal,payment_method:'COD',status:'Pending'};const {data,error}=await db.from('customer_orders').insert(payload).select('order_number').single();if(error)throw error;write('qb_recent_order',{at:new Date().toISOString(),order_number:data?.order_number||null,items,total:subtotal,status:'Pending'});cart={};write('qb_cart',cart);updateBadges();closeSheet();renderProducts();toast('Order placed! '+(data?.order_number?'Order #'+data.order_number:''))}catch(e){console.error(e);toast('Order failed: '+e.message);btn.disabled=false;btn.textContent='Place COD order'}}function openOrders(){const o=read('qb_recent_order',null);openSheet(`<div class="sheethead"><h2>Recent order</h2><button class="close" onclick="closeSheet()">×</button></div>${o?`<p>Order #${esc(o.order_number||'')}</p><p>Status: ${esc(o.status)}</p><p>${o.items.map(x=>esc(x.name)+' × '+x.quantity).join('<br>')}</p><b>${money(o.total)}</b>`:'<div class="empty"><b>No recent order on this device</b>After placing an order, its summary appears here.</div>'}`)}updateAddressLabel();updateBadges();loadProducts();
</script></body></html>
